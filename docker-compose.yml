x-app-environment: &app-environment
  # 本地默认 dev；部署到共享环境时必须显式覆盖 APP_ENV 与全部密钥。
  APP_ENV: ${APP_ENV:-dev}
  # 进程角色：app 只提供 API/SSE，worker 服务只消费持久化任务。
  WORKER_ROLE: api
  DATABASE_URL: postgres://harness_app:${POSTGRES_PASSWORD:-harness}@postgres:5432/harness?sslmode=disable
  AUTH_DATABASE_URL: postgres://harness_auth:${POSTGRES_PASSWORD:-harness}@postgres:5432/harness?sslmode=disable
  REDIS_ADDR: redis:6379
  REDIS_PASSWORD: ${REDIS_PASSWORD:-harness}
  JWT_SIGNING_KEY_ID: dev
  JWT_SIGNING_KEY_SECRET: ${JWT_SIGNING_KEY_SECRET:-dev-only-jwt-secret-01234567890123456789}
  REFRESH_TOKEN_PEPPER: ${REFRESH_TOKEN_PEPPER:-dev-only-refresh-pepper-0123456789012345}
  AUDIT_PSEUDONYM_KEY: ${AUDIT_PSEUDONYM_KEY:-dev-only-audit-key-01234567890123456789}
  CREDENTIAL_ENCRYPTION_KEY_ID: dev
  CREDENTIAL_ENCRYPTION_KEY_SECRET: ${CREDENTIAL_ENCRYPTION_KEY_SECRET:-dev-only-credential-key-01234567}
  # 本地开发允许访问公司内网 MCP（例如 contextforge）；生产按实际网络策略显式开启。
  MCP_ALLOW_PRIVATE_ENDPOINTS: "true"
  # 飞书事件接入；长连接模式只需 FEISHU_ENABLED=true、FEISHU_EVENT_MODE=long_connection。
  FEISHU_ENABLED: ${FEISHU_ENABLED:-false}
  FEISHU_EVENT_MODE: ${FEISHU_EVENT_MODE:-}
  FEISHU_APP_ID: ${FEISHU_APP_ID:-}
  FEISHU_APP_SECRET: ${FEISHU_APP_SECRET:-}
  FEISHU_LOGIN_REDIRECT_URL: ${FEISHU_LOGIN_REDIRECT_URL:-}
  FEISHU_VERIFICATION_TOKEN: ${FEISHU_VERIFICATION_TOKEN:-}
  FEISHU_ENCRYPT_KEY_ID: ${FEISHU_ENCRYPT_KEY_ID:-}
  FEISHU_ENCRYPT_KEY_SECRET: ${FEISHU_ENCRYPT_KEY_SECRET:-}
  FEISHU_BOT_OPEN_ID: ${FEISHU_BOT_OPEN_ID:-}
  FEISHU_BOT_NAME: ${FEISHU_BOT_NAME:-}
  FEISHU_DEFAULT_AGENT_ID: ${FEISHU_DEFAULT_AGENT_ID:-}
  FEISHU_DEFAULT_AGENT_VERSION: ${FEISHU_DEFAULT_AGENT_VERSION:-}

x-migrate-environment: &migrate-environment
  APP_ENV: ${APP_ENV:-dev}
  DATABASE_URL: postgres://harness:${POSTGRES_PASSWORD:-harness}@postgres:5432/harness?sslmode=disable
  AUTH_DATABASE_URL: postgres://harness_auth:${POSTGRES_PASSWORD:-harness}@postgres:5432/harness?sslmode=disable
  REDIS_ADDR: redis:6379
  REDIS_PASSWORD: ${REDIS_PASSWORD:-harness}
  JWT_SIGNING_KEY_ID: dev
  JWT_SIGNING_KEY_SECRET: ${JWT_SIGNING_KEY_SECRET:-dev-only-jwt-secret-01234567890123456789}
  REFRESH_TOKEN_PEPPER: ${REFRESH_TOKEN_PEPPER:-dev-only-refresh-pepper-0123456789012345}
  AUDIT_PSEUDONYM_KEY: ${AUDIT_PSEUDONYM_KEY:-dev-only-audit-key-01234567890123456789}
  CREDENTIAL_ENCRYPTION_KEY_ID: dev
  CREDENTIAL_ENCRYPTION_KEY_SECRET: ${CREDENTIAL_ENCRYPTION_KEY_SECRET:-dev-only-credential-key-01234567}

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg18
    environment:
      POSTGRES_DB: harness
      POSTGRES_USER: harness
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-harness}
    ports:
      # 只监听回环地址，避免本地数据库端口暴露到局域网。
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harness -d harness"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8.2.3-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-harness}", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-harness}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: .
    entrypoint: ["/app/harness-migrate"]
    command: ["up"]
    environment: *migrate-environment
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build:
      context: .
    environment: *app-environment
    ports:
      # 只监听回环地址；对外暴露应由反向代理统一处理 TLS 与访问控制。
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:9190:9090"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # 只读根文件系统：应用不写本地磁盘，临时文件走 tmpfs。
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 1g
    cpus: 2
    # role=all 时也会执行 Worker，宽限期需覆盖排空、终态写与退队。
    stop_grace_period: 150s
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health/ready | grep -Eq '^[{].*\"status\":\"(ready|degraded)\"[}]'"]
      interval: 5s
      timeout: 3s
      retries: 20

  worker:
    build:
      context: .
    # 独立 Worker 入口：不监听 HTTP，只消费 jobs 队列。
    entrypoint: ["/app/harness-worker"]
    environment:
      <<: *app-environment
      WORKER_ROLE: worker
      # worker 角色必须显式声明池过滤，避免漏配时静默抢占全部 lane；* 表示启动全部池。
      WORKER_POOLS: "*"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # 与 app 相同的只读与降权基线；长任务需要更长的停机宽限。
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 1g
    cpus: 2
    # 宽限期需覆盖 agent.worker.drain_timeout（默认 90s），留出收尾余量。
    stop_grace_period: 150s
    # Worker 不监听 HTTP，镜像内置的 /health/ready 健康检查不适用。
    healthcheck:
      disable: true

volumes:
  postgres-data:
  redis-data:
