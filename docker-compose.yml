x-app-environment: &app-environment
  APP_ENV: dev
  DATABASE_URL: postgres://harness_app:harness@postgres:5432/harness?sslmode=disable
  AUTH_DATABASE_URL: postgres://harness_auth:harness@postgres:5432/harness?sslmode=disable
  REDIS_ADDR: redis:6379
  REDIS_PASSWORD: harness
  JWT_SIGNING_KEY_ID: dev
  JWT_SIGNING_KEY_SECRET: dev-only-jwt-secret-01234567890123456789
  REFRESH_TOKEN_PEPPER: dev-only-refresh-pepper-0123456789012345
  AUDIT_PSEUDONYM_KEY: dev-only-audit-key-01234567890123456789
  CREDENTIAL_ENCRYPTION_KEY_ID: dev
  CREDENTIAL_ENCRYPTION_KEY_SECRET: dev-only-credential-key-01234567
  # 本地开发允许访问公司内网 MCP（例如 contextforge）；生产按实际网络策略显式开启。
  MCP_ALLOW_PRIVATE_ENDPOINTS: "true"
  # 飞书事件接入；长连接模式只需 FEISHU_ENABLED=true、FEISHU_EVENT_MODE=long_connection。
  FEISHU_ENABLED: ${FEISHU_ENABLED:-false}
  FEISHU_EVENT_MODE: ${FEISHU_EVENT_MODE:-}
  FEISHU_APP_ID: ${FEISHU_APP_ID:-}
  FEISHU_APP_SECRET: ${FEISHU_APP_SECRET:-}
  FEISHU_LOGIN_REDIRECT_URL: ${FEISHU_LOGIN_REDIRECT_URL:-}
  FEISHU_VERIFICATION_TOKEN: ${FEISHU_VERIFICATION_TOKEN:-}
  FEISHU_ENCRYPT_KEY_ID: ${FEISHU_ENCRYPT_KEY_ID:-}
  FEISHU_ENCRYPT_KEY_SECRET: ${FEISHU_ENCRYPT_KEY_SECRET:-}
  FEISHU_BOT_OPEN_ID: ${FEISHU_BOT_OPEN_ID:-}
  FEISHU_BOT_NAME: ${FEISHU_BOT_NAME:-}
  FEISHU_DEFAULT_AGENT_ID: ${FEISHU_DEFAULT_AGENT_ID:-}
  FEISHU_DEFAULT_AGENT_VERSION: ${FEISHU_DEFAULT_AGENT_VERSION:-}

x-migrate-environment: &migrate-environment
  APP_ENV: dev
  DATABASE_URL: postgres://harness:harness@postgres:5432/harness?sslmode=disable
  AUTH_DATABASE_URL: postgres://harness_auth:harness@postgres:5432/harness?sslmode=disable
  REDIS_ADDR: redis:6379
  REDIS_PASSWORD: harness
  JWT_SIGNING_KEY_ID: dev
  JWT_SIGNING_KEY_SECRET: dev-only-jwt-secret-01234567890123456789
  REFRESH_TOKEN_PEPPER: dev-only-refresh-pepper-0123456789012345
  AUDIT_PSEUDONYM_KEY: dev-only-audit-key-01234567890123456789
  CREDENTIAL_ENCRYPTION_KEY_ID: dev
  CREDENTIAL_ENCRYPTION_KEY_SECRET: dev-only-credential-key-01234567

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg18
    environment:
      POSTGRES_DB: harness
      POSTGRES_USER: harness
      POSTGRES_PASSWORD: harness
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harness -d harness"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8.2.3-alpine
    command: ["redis-server", "--requirepass", "harness", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "harness", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: .
    entrypoint: ["/app/harness-migrate"]
    command: ["up"]
    environment: *migrate-environment
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build:
      context: .
    environment: *app-environment
    ports:
      - "8080:8080"
      - "9190:9090"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # 只读根文件系统：应用不写本地磁盘，临时文件走 tmpfs。
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 1g
    cpus: 2
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
  redis-data:
