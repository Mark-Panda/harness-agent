global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yaml

scrape_configs:
  - job_name: harness-agent
    static_configs:
      - targets: ["app:8080"]

  # 外部合成监控：通过 blackbox exporter 从集群外视角探测健康与就绪端点。
  - job_name: harness-agent-synthetic
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://app:8080/health/live
          - http://app:8080/health/ready
          - http://app:8080/api/v1/health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
