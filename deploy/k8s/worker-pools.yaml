# Worker 资源池示例：每个 Deployment 只启动一个池/组件，独立配置资源与 HPA。
# 前置条件：
#   1. 镜像内已包含 /app/harness-worker（Dockerfile 已构建）；
#   2. configs/config.yaml 中已配置 agent.worker.pools；
#   3. 集群已安装 Prometheus Adapter，并将 harness_jobs_pending 暴露为带 lane 标签的 External 指标；
#      每个 API 副本都会导出同一份全库队列深度，聚合必须用 max 而不是 sum：
#        max(harness_jobs_pending) by (lane)
#   4. 单池有效副本上限 = ceil(pool.global_concurrency / pool.concurrency)，HPA maxReplicas 不应超过该值；
#      超出部分抢不到池级全局舱壁槽位只会空转，需要更高并发时先调大 global_concurrency。
#   5. agent.worker.drain_timeout（默认 90s）必须小于 terminationGracePeriodSeconds；
#      停机时 Worker 会先排空在途任务，超时后释放 Job 与 Run 租约供其他副本立即接管。
#   6. Secret harness-runtime 注入数据库、Redis、JWT、凭证加密等环境变量。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: harness-worker-react
  labels: {app: harness-worker, pool: react}
spec:
  replicas: 1
  selector:
    matchLabels: {app: harness-worker, pool: react}
  template:
    metadata:
      labels: {app: harness-worker, pool: react}
    spec:
      # drain 90s + 终态写入超时 10s + 退队 5s，留出进程退出余量。
      terminationGracePeriodSeconds: 150
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: worker
          image: harness-agent:latest
          command: ["/app/harness-worker"]
          envFrom:
            - secretRef: {name: harness-runtime}
          env:
            - {name: WORKER_ROLE, value: worker}
            - {name: WORKER_COMPONENTS, value: execution}
            - {name: WORKER_POOLS, value: react}
          resources:
            requests: {cpu: "500m", memory: "512Mi"}
            limits: {cpu: "2", memory: "1Gi"}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: harness-worker-react
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: harness-worker-react
  minReplicas: 1
  # 8 全局并发 / 单副本 4 并发 = 最多 2 个有效副本。
  maxReplicas: 2
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
  metrics:
    - type: External
      external:
        metric:
          name: harness_jobs_pending
          selector:
            matchLabels: {lane: react}
        target:
          type: AverageValue
          averageValue: "5"
---
