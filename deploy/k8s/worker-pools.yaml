apiVersion: apps/v1
kind: Deployment
metadata:
  name: harness-worker-feishu
  labels: {app: harness-worker, component: feishu}
spec:
  # 飞书回复 Worker 的单群聊并发限制当前是进程内实现，默认保持单副本。
  replicas: 1
  selector:
    matchLabels: {app: harness-worker, component: feishu}
  template:
    metadata:
      labels: {app: harness-worker, component: feishu}
    spec:
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: worker
          image: harness-agent:latest
          command: ["/app/harness-worker"]
          envFrom:
            - secretRef: {name: harness-runtime}
          env:
            - {name: WORKER_ROLE, value: worker}
            - {name: WORKER_COMPONENTS, value: feishu}
          resources:
            requests: {cpu: "250m", memory: "256Mi"}
            limits: {cpu: "1", memory: "512Mi"}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {}
