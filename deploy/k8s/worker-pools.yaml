# Worker 资源池示例：每个 Deployment 只启动一个池/组件，独立配置资源与 HPA。
# 前置条件：
#   1. 镜像内已包含 /app/harness-worker（Dockerfile 已构建）；
#   2. configs/config.yaml 中已配置 agent.worker.pools；
#   3. 集群已安装 Prometheus Adapter，并将 harness_jobs_pending 暴露为带 lane 标签的 External 指标；
#   4. Secret harness-runtime 注入数据库、Redis、JWT、凭证加密等环境变量。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: harness-worker-react
  labels: {app: harness-worker, pool: react}
spec:
  replicas: 1
  selector:
    matchLabels: {app: harness-worker, pool: react}
  template:
    metadata:
      labels: {app: harness-worker, pool: react}
    spec:
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: worker
          image: harness-agent:latest
          command: ["/app/harness-worker"]
          envFrom:
            - secretRef: {name: harness-runtime}
          env:
            - {name: WORKER_ROLE, value: worker}
            - {name: WORKER_COMPONENTS, value: execution}
            - {name: WORKER_POOLS, value: react}
          resources:
            requests: {cpu: "500m", memory: "512Mi"}
            limits: {cpu: "2", memory: "1Gi"}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: harness-worker-react
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: harness-worker-react
  minReplicas: 1
  maxReplicas: 10
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
  metrics:
    - type: External
      external:
        metric:
          name: harness_jobs_pending
          selector:
            matchLabels: {lane: react}
        target:
          type: AverageValue
          averageValue: "5"
---
