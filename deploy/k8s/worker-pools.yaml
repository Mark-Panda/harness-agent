apiVersion: apps/v1
kind: Deployment
metadata:
  name: harness-worker-background
  labels: {app: harness-worker, component: background}
spec:
  replicas: 1
  selector:
    matchLabels: {app: harness-worker, component: background}
  template:
    metadata:
      labels: {app: harness-worker, component: background}
    spec:
      # drain 90s + 批次收尾写（DB 超时 30s）需完整落在 grace 内。
      terminationGracePeriodSeconds: 150
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: worker
          image: harness-agent:latest
          command: ["/app/harness-worker"]
          envFrom:
            - secretRef: {name: harness-runtime}
          env:
            - {name: WORKER_ROLE, value: worker}
            - {name: WORKER_COMPONENTS, value: background}
          resources:
            requests: {cpu: "250m", memory: "512Mi"}
            limits: {cpu: "1", memory: "1Gi"}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: harness-worker-background
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: harness-worker-background
  minReplicas: 1
  maxReplicas: 6
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
  metrics:
    - type: External
      external:
        metric:
          name: harness_jobs_pending
          selector:
            matchLabels: {lane: background}
        target:
          type: AverageValue
          averageValue: "20"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: harness-worker-feishu
  labels: {app: harness-worker, component: feishu}
spec:
  # 飞书回复 Worker 的单群聊并发限制当前是进程内实现，默认保持单副本。
  replicas: 1
  selector:
    matchLabels: {app: harness-worker, component: feishu}
  template:
    metadata:
      labels: {app: harness-worker, component: feishu}
    spec:
      terminationGracePeriodSeconds: 150
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: worker
          image: harness-agent:latest
          command: ["/app/harness-worker"]
          envFrom:
            - secretRef: {name: harness-runtime}
          env:
            - {name: WORKER_ROLE, value: worker}
            - {name: WORKER_COMPONENTS, value: feishu}
          resources:
            requests: {cpu: "250m", memory: "256Mi"}
            limits: {cpu: "1", memory: "512Mi"}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: harness-worker-deletion
  labels: {app: harness-worker, component: deletion}
spec:
  # 删除/注销请求不在 jobs.lane 体系内，必须独立部署；API 角色不会消费。
  replicas: 1
  selector:
    matchLabels: {app: harness-worker, component: deletion}
  template:
    metadata:
      labels: {app: harness-worker, component: deletion}
    spec:
      terminationGracePeriodSeconds: 300
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: worker
          image: harness-agent:latest
          command: ["/app/harness-worker"]
          envFrom:
            - secretRef: {name: harness-runtime}
          env:
            - {name: WORKER_ROLE, value: worker}
            - {name: WORKER_COMPONENTS, value: deletion}
          resources:
            requests: {cpu: "100m", memory: "256Mi"}
            limits: {cpu: "500m", memory: "512Mi"}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {}
---
# PodDisruptionBudget：节点排空/驱逐时至少保留一个副本，避免单个池整体中断。
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: harness-worker-react
spec:
  maxUnavailable: 1
  selector:
    matchLabels: {app: harness-worker, pool: react}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: harness-worker-plan
spec:
  maxUnavailable: 1
  selector:
    matchLabels: {app: harness-worker, pool: plan}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: harness-worker-super
spec:
  maxUnavailable: 1
  selector:
    matchLabels: {app: harness-worker, pool: super}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: harness-worker-background
spec:
  maxUnavailable: 1
  selector:
    matchLabels: {app: harness-worker, component: background}
