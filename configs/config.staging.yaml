environment: staging

agent:
  sandbox:
    # 预发布验证生产等效安全策略，高风险工具必须走 Sandbox Runner。
    require_for_high_risk: true

server:
  http:
    addr: 0.0.0.0:8080
    # 预发布与生产等效，TLS 由环境变量启用。
    tls:
      enabled: ${TLS_ENABLED}
      cert_file: ${TLS_CERT_FILE}
      key_file: ${TLS_KEY_FILE}
      min_version: 1.3
  cookie_secure: true
