environment: production

auth:
  # 生产默认关闭开放注册，由管理员通过 /api/v1/admin/users 邀请创建。
  registration_enabled: false

agent:
  sandbox:
    # 生产环境高风险工具禁止进程内执行，必须配置 Sandbox Runner 端点与令牌。
    require_for_high_risk: true

server:
  http:
    addr: 0.0.0.0:8080
    # 生产必须启用应用层 TLS 或由入口完成端到端 TLS；证书由密钥管理注入。
    tls:
      enabled: ${TLS_ENABLED}
      cert_file: ${TLS_CERT_FILE}
      key_file: ${TLS_KEY_FILE}
      min_version: 1.3
  cookie_secure: true
