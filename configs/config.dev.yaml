environment: development

server:
  http:
    addr: 0.0.0.0:8080

agent:
  skills:
    # 开发环境允许执行技能脚本，便于本地联调；生产与预发由配置校验强制关闭。
    enable_local_execution: true
  tools:
    # 本地联调开启内置 Shell 与 HTTP 工具；生产环境由配置校验强制关闭本机执行。
    shell:
      enabled: true
      allow_local_execution: true
      # 本机 Shell 与服务共享同一 OS 用户，可读取服务端环境变量；仅限可信单用户开发环境。
      allow_unsafe_local_execution: true
      # 容器内 /tmp 为可写 tmpfs；运行时按用户 ID 在基础目录下派生子目录。
      workdir: /tmp/agent-workspace
    http:
      enabled: true
      allow_local_execution: true
    files:
      enabled: true
      allow_local_execution: true
      root: /tmp/agent-workspace
  memory:
    vector:
      # 本地联调开启结果重排：向量召回后调用已启用的 rerank 模型重新打分；模型不可用时自动降级为向量分数。
      rerank_enabled: true
    skill_synthesis:
      # 联调验收开启每日技能提炼；生产默认关闭，需显式开启并指定模型策略。
      enabled: true
      # 平台默认提炼策略：必须引用本环境已发布的策略版本。
      # 旧值 cc7565ca-.../v1 在当前库中不存在，导致提炼任务静默跳过；改用已发布的“个人”策略 v2。
      default_model_policy_id: "bba3e21f-437d-4ed4-9dd9-c92d5231471b"
      default_model_policy_version: 2
      # 缩短维护扫描周期，便于在验收窗口内触发提炼任务。
      interval: 1m
