environment: development

server:
  http:
    addr: 0.0.0.0:8080

agent:
  skills:
    # 开发环境允许执行技能脚本，便于本地联调；生产与预发由配置校验强制关闭。
    enable_local_execution: true
  memory:
    vector:
      # 本地联调开启结果重排：向量召回后调用已启用的 rerank 模型重新打分；模型不可用时自动降级为向量分数。
      rerank_enabled: true
    skill_synthesis:
      # 联调验收开启每日技能提炼；生产默认关闭，需显式开启并指定模型策略。
      enabled: true
      # 平台默认提炼策略：验收环境使用已发布的“自动切换”策略（deepseek-v4.1-flash / kimi-k3）。
      default_model_policy_id: "cc7565ca-bfe2-4d3c-9568-b2f6d9a11f76"
      default_model_policy_version: 1
      # 缩短维护扫描周期，便于在验收窗口内触发提炼任务。
      interval: 1m
